# Scenario 002 -- bistatic radar over the North Carolina Piedmont.
# The Raleigh-Durham Airport ATC illuminator, received at the Duke Receiver.
# See spec/scenario-002-bistatic.md. The two variants share every
# block below except [[burst]].f0_hz; the carrier is the whole comparison.

[scenario]
name = "scenario-002-bistatic-sband"
description = "B2: 2.8 GHz, the realistic S-band ATC illuminator. The same geometry and processing as B1, but 3.5x more unambiguous velocity: Doppler folds at +-26.77 m/s."
seed = 20260915

# The receiving site. Unchanged from scenario 001; here it receives echoes
# of a transmitter 19.6 km away rather than of one standing beside it.
[radar]
latitude_deg = 36.00250
longitude_deg = -78.94100
altitude_m = 60.0

# The illuminator. Its presence is what makes this scenario bistatic; delete
# this table and the same file is a monostatic scenario at the Duke Receiver.
[transmitter_site]
latitude_deg = 35.87750   # Raleigh-Durham Airport reference point
longitude_deg = -78.78750
altitude_m = 25.0         # assumed ATC antenna height; configurable

[receiver_site]
# The receive chain at the Duke Receiver site sited by [radar] above.
gain_rx_dbi = 30.0
noise_figure_db = 3.0

[target]
name = "light-aircraft"
rcs_dbsm = 10.0        # bistatic RCS, held constant and angle-independent; see D8
altitude_m = 1500.0    # the CSV has no altitude column; held constant

# The 120 s window that maximises the mean bistatic angle over the track:
# beta runs 109.9-129.3 deg, so the geometry is strongly bistatic throughout.
# Scenario 001's window would give 40.7-44.1 deg, where little is exercised.
[trajectory]
path = "../data/flight_coordinates.csv"
start_time_s = 13329.0
duration_s = 120.0
frame_rate_hz = 1.0

# Identical to B1 but for the carrier. Terminal ATC primary surveillance radar
# is S-band; 2.8 GHz is representative. This is the physically honest variant.
[[burst]]
waveform = "fmcw"
f0_hz = 2.8e9
bandwidth_hz = 2.0e6
transmit_power_w = 100.0
gain_tx_dbi = 30.0
chirp_duration_s = 1.0e-3
prf_hz = 1.0e3
sample_rate_hz = 1.0e6
n_pulses = 256
