# Scenario 006 F3 -- the separation sweep's point that the suite checks (spec A14): aircraft B half
# a Rayleigh width right of aircraft A at 20 dB per channel. The sweep itself, P(resolved) and
# RMSE over the bound against SNR, runs on the snapshot model, x_k = g_k A(u) s + n_k over the
# chip's cells, which A13 proves equal to this chain: tests/test_doa.py checks A14 there at 200
# trials. This file is a scenario at that point, not a parameter file: the stages run the IQ
# chain on its frames, as F1 and F2 do. It differs from F2 in [second_aircraft]'s and the target's
# cross-sections only, -12 dBsm each, 22 dB below F2's, for 20.0 dB per channel at frame 0.
# Every range and rate on the map is bistatic, positive receding.

[scenario]
name = "scenario-006-parallel-sweep"
description = "F3: the sweep point A14 checks, F2's pair at 20 dB per channel. ML, FBSS-ESPRIT and IAA resolve it at P = 0.97, 0.91 and 0.80 on the snapshot model; the chain shows the same on its frames."
seed = 20261106

[[target]]
name = "aircraft-a"
rcs_dbsm = -12.0       # Swerling 0; 22 dB below F2 for 20 dB per channel
trajectory_path = "../data/flight_coordinates.csv"
altitude_m = 1500.0    # the CSV has no altitude column; held constant

[second_aircraft]
name = "aircraft-b"
separation_rayleigh = 0.5
rcs_dbsm = -12.0
scattering_phase = "uniform"   # a new phase each frame, from default_rng([seed, 6])

[frames]
start_time_s = 0.0
duration_s = 120.0     # 120 frames, t = 0 ... 119 s
frame_rate_hz = 1.0

[site.tx]
# The Duke Receiver. With no [site.rx] the array stands here too: monostatic.
latitude_deg = 36.00250
longitude_deg = -78.94100
altitude_m = 60.0

# S1, as scenario 001: 1 ms sweep at 2 GHz/s, deramped at 1 MHz, 256 chirps.
[[burst]]
waveform = "fmcw"
carrier_frequency_hz = 9.8e9
bandwidth_hz = 2.0e6
transmit_power_w = 100.0
gain_tx_dbi = 30.0
chirp_duration_s = 1.0e-3
prf_hz = 1.0e3
sample_rate_hz = 1.0e6
n_pulses = 256

# 16 channels half a wavelength apart (15.2955 mm; aperture 0.24473 m), centred on the phase
# centre. Boresight: the circular mean of aircraft A's bearing over the window's 120 frames.
[receive_array]
n_rx = 16
element_spacing_wavelengths = 0.5
boresight_azimuth_deg = 235.795
boresight_elevation_deg = 0.0

# Per channel: a lambda/2 x 0.4869 m column is 20 dBi; 16 combine to 32.04 dBi.
[receiver]
gain_rx_dbi = 20.0
noise_figure_db = 3.0

# Scenario 001's CA-CFAR along range, which wraps, on the boresight beam's map.
[detection]
pfa = 1e-5
n_train = 16
n_guard = 4
variant = "ca"
merge_range_bins = 1.0
max_bistatic_range_rate_mps = 400.0

# Capon, MUSIC, root-MUSIC and ESPRIT train on the chip's 5 x 5 cells; Bartlett, IAA, SPICE
# and ML take its peak cell (D14).
[doa]
methods = ["bartlett", "capon", "music", "esprit", "fb_music", "fbss_music", "fbss_esprit", "iaa", "spice", "deterministic_ml"]
n_sources = 2
n_subarray_elements = 12     # K = 5 subarrays; their Rayleigh width 0.1667 in u
n_iaa_iterations = 15
n_spice_iterations = 60
n_grid = 4096                # u in [-1, 1): every direction once at half a wavelength
half_width_bins = 2

[verify]
stages = ["geometry", "iq", "rd", "detect", "doa"]
# Per channel at frame 0: F2's 42.01 dB less 22 dB. The window spans 19.24 to 20.95 dB.
expected_snr_db = 20.01
snr_tolerance_db = 0.01
truth_in_map_fraction = [0.0, 0.25]
noise_tolerance_db = 0.05
# The beam's 12 dB of array gain still detects the pair every frame: 32 dB on the beam map.
truth_within_bins = 1.0
detection_fraction = 1.0
rate_tolerance_mps = 0.119496
# A14 on the chain's frames: the loosest of its three bounds, IAA's 0.65, over the three methods.
# Their own bounds, ML >= 0.90 and FBSS-ESPRIT >= 0.85, are checked at 200 trials in tests/test_doa.py.
resolved_methods = ["deterministic_ml", "fbss_esprit", "iaa"]
resolved_fraction_min = 0.65
# A16 holds at any SNR: the chip's cell, bins and estimates equal the uncropped map's.
parent_coordinates_tolerance = 1e-12
