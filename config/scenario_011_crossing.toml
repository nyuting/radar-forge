# Scenario 011, V2 "crossing": two aircraft at 72 m/s crossing at 20 km, at 90,
# 30 and 10 deg, each angle once closing along range and once across it, six
# pairs in all, far enough apart that no gate holds two pairs. Each crossing
# sits in a disc of clutter at n_gate = 1 (0.21683 plots per m rad a scan) of
# radius 2.5 km, 983.7 m rad: about 213 false plots a disc a scan. Outside the
# discs there is no clutter, so tracks start clean and meet the clutter later.
# A 10 deg crossing closing across range spends about sixteen scans inside one
# resolution cell (spec 011 §2.2): GNN swaps there and JPDA coalesces.

[scenario]
name = "scenario-011-crossing"
description = "V2: six pairs of aircraft crossing at 90, 30 and 10 deg, closing along and across range, in local clutter at n_gate = 1, tracked by JPDA with M-of-N."
seed = 20261107

[frames]
start_time_s = 0.0
duration_s = 300.0     # 62.5 -> 62 rotations; every crossing at 200 s, scan 41

[sensor]
carrier_frequency_hz = 2.8e9
scan_period_s = 4.8
beamwidth_azimuth_deg = 1.4
range_cell_m = 115.75
range_min_m = 1000.0
range_max_m = 40000.0
sigma_range_m = 33.414
sigma_azimuth_deg = 0.15
pd_aircraft = 0.90
pd_bird = 0.30
mti_notch_mps = 4.0
pd_notch = 0.30
n_sectors = 16

[tracking]
linearisation = "taylor"
motion = "cv"
sigma_acceleration_mps2 = 0.5   # CV quiet: q = 2 sigma^2 tau = 0.5 m^2/s^3
association = "jpda"
coalescence = "none"
gate_probability = 0.99
detection_probability = 0.90
n_confirm_hits = 4
n_confirm_scans = 5
n_delete_misses = 3
assignment = "confirmed_first"
clutter_intensity = "oracle"
# No track starts where the clutter is denser than n_gate = 0.05: inside the
# discs only an established track continues.
max_birth_clutter_intensity_per_m_rad = 0.01
initial_speed_sigma_mps = 150.0
# A track whose position sigma passes 300 m after its update is deleted
# (tracker-001 §5.4): a gate that wide holds 85 rain plots at 20 km.
max_position_sigma_m = 300.0
# Spec 011b: the same plots also scored by GNN, JPDA*, Set-JPDA, JIPDA, MHT and
# PMBM, each score prefixed by its name; the checks below are JPDA's.
trackers = ["gnn", "jpda_star", "set", "jipda", "mht", "pmbm"]

[verify]
stages = ["multitarget"]
# Spec 011b D29: an MHT tree holds at most k_best = 10 leaves, one per hypothesis.
leaf_count_max = 10
# Mean GOSPA over the 62 rotations; pins the run (323 m measured): until 41 every aircraft is
# alone, then the crossings and the clutter discs.
gospa_mean_max_m = 400.0
# Spec 011 V2: crossings after which either aircraft's GOSPA track changed, JPDA, 2 of 7
# measured; A15 bounds GNN and MHT in 011b, JPDA is reported, not bounded: this pins it.
swap_fraction_max = 0.6
nees_fraction_min = 0.9           # 0.95 measured
pd_min = 0.8704                 # Pd 0.9: 99 % binomial lower bound over 710 echoes
false_alarm_rate_max = 1.1        # three scans expect 3839 plots in the discs

# Pair X1: 90 deg apart, closing across range, crossing at 200 s at azimuth 30 deg, 20 km.
[[target]]
name = "X1a"
kind = "arc"
class = "aircraft"
position_enu_m = [13727.0, 3411.2]
heading_deg = 345.0
speed_mps = 72.0

