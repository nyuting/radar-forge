# Scenario 011b, V3 "cst_sweep": the separation sweep's point d = 1 across
# range at n_gate = 1. Two aircraft 1.4 deg apart in azimuth (one beamwidth,
# d = 1 in tracking.scene.resolve's normalised plane) at 20 km, each flying out
# along its own bearing at 72 m/s, so d holds for the run, inside a 2.5 km disc
# of clutter (983.7 m rad, about 213 false plots a scan) drifting with them.
# Plots merge with P_u(1) = 0.61. The pair sits at azimuth 180 deg, where one
# sector batch a rotation is stamped at the beam's crossing. V3 compares
# association, not initiation: every tracker starts with each aircraft's track
# at its truth, confirmed, no track is born inside the clutter, and nothing is
# deleted in 40 scans but a track already lost. The sweep over d in
# {0.25, 0.5, 1, 2, 4}, n_gate in {0.1, 1, 3} and both orientations, 100 trials
# a point, is tests/tracking/test_separation_sweep.py's slow Monte Carlo
# through this stage's own code.

[scenario]
name = "scenario-011-cst-sweep"
description = "V3: a pair of aircraft one beamwidth apart at 20 km in n_gate = 1 clutter, tracked by GNN, the JPDA family, JIPDA, MHT and PMBM from cues at the truth."
seed = 20261109

[frames]
start_time_s = 0.0
duration_s = 192.0     # 40 rotations of 4.8 s

[sensor]
carrier_frequency_hz = 2.8e9
scan_period_s = 4.8
beamwidth_azimuth_deg = 1.4
range_cell_m = 115.75
range_min_m = 1000.0
range_max_m = 40000.0
sigma_range_m = 33.414
sigma_azimuth_deg = 0.15
pd_aircraft = 0.90
pd_bird = 0.30
mti_notch_mps = 4.0
pd_notch = 0.30
n_sectors = 1          # one batch a rotation, at 180 deg: the pair's crossing

[tracking]
linearisation = "taylor"
motion = "cv"
sigma_acceleration_mps2 = 0.5   # CV quiet, every tracker
association = "jpda"
coalescence = "none"
gate_probability = 0.99
detection_probability = 0.90
n_confirm_hits = 1              # a cue is confirmed at once
n_confirm_scans = 1
n_delete_misses = 40            # and never deleted in 40 scans
assignment = "joint"
clutter_intensity = "oracle"
max_birth_clutter_intensity_per_m_rad = 0.01   # no track starts in the clutter
initial_speed_sigma_mps = 150.0
delete_drop = inf               # MHT deletes nothing either,
survival_probability = 1.0      # nor JIPDA nor PMBM: a sure target stays sure
# A track whose position sigma passes 300 m is deleted, as on V2 (tracker-001 §5.4): it can no
# longer be within c/2 of its aircraft, and its gate would hold hundreds of plots, past JPDA's
# event bound at n_gate = 3.
max_position_sigma_m = 300.0
seed_truth = true
trackers = ["gnn", "jpda_star", "set", "jipda", "mht", "pmbm"]

[verify]
stages = ["multitarget"]
# Spec 011b D29: a tree holds at most k_best = 10 leaves, one per hypothesis of its cluster.
leaf_count_max = 10
# PMBM reports both aircraft and nothing else: mean |tracks - aircraft| a rotation.
pmbm_cardinality_error_max = 0.1
# A16 (MHT clause) at this seed: MHT resolves the pair whenever JPDA does.
mht_resolved_lead_min = 0.0
# A17 at this seed: PMBM resolves the pair as often as any other tracker, less 0.05.
pmbm_resolved_lead_min = -0.05

[[target]]
name = "P1"
kind = "arc"
class = "aircraft"
position_enu_m = [244.34, -19998.51]   # 20 km at azimuth 179.3 deg
heading_deg = 179.3
speed_mps = 72.0

[[target]]
name = "P2"
kind = "arc"
class = "aircraft"
position_enu_m = [-244.34, -19998.51]  # 20 km at azimuth 180.7 deg
heading_deg = 180.7
speed_mps = 72.0

[[clutter_plots.component]]
name = "disc about the pair"
intensity_per_m_rad = 0.21683   # n_gate = 1
range_min_m = 1000.0
range_max_m = 40000.0
centre_enu_m = [0.0, -20000.0]
radius_m = 2500.0
drift_enu_mps = [0.0, -72.0]
