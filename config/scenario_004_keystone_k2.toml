# Scenario 004 K2 -- a sounding rocket under 15 g of thrust, closing at 340 m/s radial at pulse
# 0, seen by a wideband X-band tracking radar downrange of the pad. The three variants share
# every block but [[target]], [migration] and [verify]. Every range and rate on the map is
# bistatic, positive receding: twice the slant range, radial velocity and acceleration. Slow
# time starts at pulse 0, the frame's truth time and the keystone's reference.

[scenario]
name = "scenario-004-keystone-k2"
description = "K2: walk and Doppler spread. Under 15 g the echo also spreads 4.03 Doppler bins: the keystone alone leaves 4.3 dB, the Doppler-rate filter, its acceleration searched, the rest."
seed = 20261106

[[target]]
name = "sounding-rocket"
rcs_dbsm = -10.0                               # 0.1 m^2, Swerling 0
position_enu_m = [0.0, 2500.0, 0.0]            # due north, 2500 m slant: 5000 m bistatic
velocity_enu_mps = [0.0, -340.0, 0.0]          # -680 m/s bistatic at pulse 0
acceleration_enu_mps2 = [0.0, -147.09975, 0.0] # 15 g closing: -294.1995 m/s^2 bistatic

[frames]
start_time_s = 0.0
duration_s = 0.075   # three frames; a fixed gate holds the target no longer
frame_rate_hz = 40.0 # one 20.48 ms dwell every 25 ms

[site.tx]
# A tracking radar downrange of a sounding-rocket pad; no [site.rx]: monostatic.
latitude_deg = 37.85
longitude_deg = -75.47
altitude_m = 10.0

# As K1: 0.5 us, 500 MHz LFM; f_s 600 MHz (0.49965 m bistatic bins); PRI 20 us, 1024 pulses.
[[burst]]
waveform = "pulsed"
carrier_frequency_hz = 9.8e9
bandwidth_hz = 500.0e6
transmit_power_w = 100.0
gain_tx_dbi = 25.0
chirp_duration_s = 0.5e-6
prf_hz = 50.0e3
sample_rate_hz = 600.0e6
n_pulses = 1024
# Bistatic gate start: sample 9607, 4800.18 m; 1024 samples. The target sits at bin 399.9.
range_gate_start_m = 4800.0
n_gate_samples = 1024

[receiver]
gain_rx_dbi = 25.0
noise_figure_db = 3.0

[detection]
pfa = 1.0e-6
n_train = 16
n_guard = 4
variant = "ca"
merge_range_bins = 1.0
max_bistatic_range_rate_mps = 760.0

# The Doppler-rate filter tries every 10 m/s^2 (bistatic) from -400 to -200: a step is under
# a tenth of a dB on the curve, whose 1 dB width is about 150 m/s^2 either side.
[migration]
method = "keystone_doppler_rate"
keystone = "czt"
acceleration_search_mps2 = [-400.0, -200.0, 10.0]

# Losses as K1: map peak over N^2 times pulse 0's peak; expected values from the
# range-frequency model with the chirp's own spectrum.
[verify]
stages = ["geometry", "iq", "rd", "detect", "keystone"]
expected_snr_db = 28.886
snr_tolerance_db = 0.01
truth_in_map_fraction = [1.0, 1.0]
noise_tolerance_db = 0.03
peak_tolerance_db = 0.01
truth_within_bins = 1.0
detection_fraction = 1.0
rate_tolerance_mps = 1.49370
# A1: the peak track's least-squares slope is the mid-dwell rate, 680 + 294.1995 x 0.01024 =
# 683.01 m/s: 683.01 x 20.48 ms / 0.49965 m = 27.995 bins, +-1 bin.
walk_bins = 27.995
walk_tolerance_bins = 1.0
residual_walk_max_bins = 0.5
# A3: uncorrected, the model gives -25.60 dB (-25.61 for a flat band); +-1.0 dB.
uncompensated_loss_db = -25.60
loss_tolerance_db = 1.0
# A5: the keystone alone leaves the spread, -4.26 dB (model), +-0.5 dB; the true acceleration's
# filter alone leaves the walk, -25.90 dB (model), +-1.0 dB.
keystone_only_loss_db = -4.26
keystone_only_loss_tolerance_db = 0.5
dechirp_only_loss_db = -25.90
# A4: keystone and Doppler-rate filter recover all but 0.3 dB.
compensated_loss_min_db = -0.3
# A7: the searched acceleration within one step of the truth.
acceleration_tolerance_mps2 = 10.0
# The fine rate at pulse 0 (local GRFT on the chip) within three of its bounds.
rate_error_max_crb = 3.0
