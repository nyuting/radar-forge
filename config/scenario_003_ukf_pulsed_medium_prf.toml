# Scenario 003, UKF over scenario 001's S2.
#
# Everything above [detection] is scenario_001_pulsed_medium_prf.toml verbatim
# but for the name and description, so the window is scenario 001's own.
# The three UKF scenarios differ only in [[burst]], as scenario 001's do.
# Every range, rate and acceleration below is of the bistatic range: twice the
# slant value.

[scenario]
name = "scenario-003-ukf-pulsed-medium-prf"
description = "The UKF tracker over scenario 001's S2. Bistatic range folds at 11.99 km, so range is measured, tracked and written modulo that; the rate is unambiguous to +-382 m/s and is measured."
seed = 20260911

[[target]]
name = "light-aircraft"
rcs_dbsm = 10.0        # 10 m^2, Swerling 0 (non-fluctuating)
trajectory_path = "../data/flight_coordinates.csv"
altitude_m = 1500.0    # the CSV has no altitude column; held constant

[frames]
start_time_s = 0.0
duration_s = 120.0     # the full track is ~16,500 frames; this window is opt-out
frame_rate_hz = 1.0

[site.tx]
# The Duke Receiver: 101 Science Drive, Durham NC. 60 m rooftop antenna.
latitude_deg = 36.00250
longitude_deg = -78.94100
altitude_m = 60.0

# One burst. 10 us LFM pulse, B = 2 MHz (time-bandwidth 20), matched-filtered.
# PRI 40 us at 2.5 MHz -> 100 samples/PRI. 256 pulses = 10.24 ms of CPI.
[[burst]]
waveform = "pulsed"
carrier_frequency_hz = 9.8e9
bandwidth_hz = 2.0e6
transmit_power_w = 1.0e3
gain_tx_dbi = 30.0
chirp_duration_s = 10.0e-6
prf_hz = 25.0e3
sample_rate_hz = 2.5e6
n_pulses = 256

[receiver]
gain_rx_dbi = 30.0
noise_figure_db = 3.0

# Cell-averaging CFAR along range, as in scenario_003_tracking.toml, so the
# two trackers are compared on the same detections.
[detection]
pfa = 1e-5
n_train = 16
n_guard = 4
variant = "ca"
merge_range_bins = 1.0
# The fastest the light aircraft can close or open: 100 m/s radial bounds a
# light aircraft in a circuit (over this window its radial rate stays within
# -56 to +40 m/s). It is the prior spread of a new track's rate, and it decides
# what one burst may measure: a burst whose rate interval is narrower may fold,
# so it measures range alone.
max_bistatic_range_rate_mps = 200.0

[tracking]
# The UKF, with continuous white-noise acceleration from the target's
# acceleration and its correlation time. Measured from scenario 001's truth:
# 4.0 m/s^2 radial, correlation falling to about a half after 1 s, so
# sigma = 8 m/s^2 of bistatic range and tau = 1 s.
linearisation = "unscented"
process_noise = "cwna"
sigma_acceleration_mps2 = 8.0
acceleration_correlation_time_s = 1.0
initiator = "direct"
cost = "nis"
assignment = "confirmed_first"
gate_probability = 0.997
# 3 hits in a track's first 5 scans confirm it; 5 misses in a row delete it.
n_confirm_hits = 3
n_confirm_scans = 5
n_delete_misses = 5
n_reacquire_misses = 0
# The UKF unfolds by dual PRF or not at all.
rate_unfolding = "none"
