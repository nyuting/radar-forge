# radar-forge project configuration.
#
# This file is the single source of truth for build, dependency, lint, type and
# test configuration. Do not add setup.py, setup.cfg, .flake8, tox.ini or a
# standalone ruff/mypy config: the library is Python, the configuration is TOML,
# and `scripts/check_conventions.py` enforces that.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar-forge"
version = "0.0.0"
description = "Open-source radar simulation and signal processing toolkit for education and research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yuting Ng" }]
keywords = ["radar", "fmcw", "phased-array", "beamforming", "ray-tracing", "dsp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
raytracing = ["mitsuba>=3.5"]
ml = ["torch>=2.2", "pillow>=10.0"]
teaching = ["matplotlib>=3.8", "PySide6>=6.6", "jupyterlab>=4.0"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Syntax colouring for the published reading view (tools/generate_reading_view.py).
    "pygments>=2.17",
    "types-Pygments",
]

[project.urls]
Homepage = "https://github.com/nyuting/radar-forge"
Documentation = "https://github.com/nyuting/radar-forge/tree/main/docs"
Issues = "https://github.com/nyuting/radar-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_forge"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on first line)
    "ANN401",  # allow typing.Any where genuinely needed
    "E741",  # radar maths legitimately uses single-letter names like `l`
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; notebooks and scripts are tools.
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["radar_forge"]

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tools"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# Optional backends and heavy deps ship without (or with partial) type information.
module = [
    "radarsimpy.*",
    "mitsuba.*",
    "drjit.*",
    "ovrtx.*",
    "scipy.*",
    "matplotlib.*",
    "PIL.*",
    "pyroomacoustics.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode: tests mirror src/ per docs/conventions/testing.md §1,
# so two modules may share a basename (tests/core/test_tracking.py and
# tests/pipelines/test_tracking.py). The default prepend mode derives a module
# name from the basename alone and refuses the collision.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "slow: takes more than a second; excluded by `make test-fast`",
    "gpu: requires a CUDA/Metal capable device",
    "raytracing: requires an optional ray-tracing backend (mitsuba, radarsimpy, ovrtx)",
    "benchmark: performance regression check, not a correctness check",
]
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.coverage.run]
source = ["src/radar_forge"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
